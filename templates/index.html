<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AirWatch Pune</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">AQ</div>
        <div>
          <p class="eyebrow">AI health intelligence</p>
          <h1>AirWatch Pune</h1>
        </div>
      </div>
      <div id="locationSwitcher" class="location-switcher" aria-label="City selector"></div>
    </header>

    <main class="dashboard">
      <section class="hero card">
        <div class="hero-copy">
          <p class="meta">Current air quality</p>
          <div class="headline-row">
            <h2 id="aqiValue">--</h2>
            <span id="statusBadge" class="status-pill">--</span>
          </div>
          <p id="summaryText" class="summary-text">Loading air quality overview...</p>
        </div>

        <div class="hero-grid">
          <div class="metric-block">
            <span>PM2.5</span>
            <strong id="pm25Value">--</strong>
          </div>
          <div class="metric-block">
            <span>PM10</span>
            <strong id="pm10Value">--</strong>
          </div>
          <div class="metric-block">
            <span>NO₂</span>
            <strong id="no2Value">--</strong>
          </div>
          <div class="metric-block">
            <span>O₃</span>
            <strong id="o3Value">--</strong>
          </div>
        </div>
      </section>

      <section class="stats-grid">
        <article class="card stat-card">
          <p class="meta">24h average AQI</p>
          <h3 id="avg24Value">--</h3>
        </article>
        <article class="card stat-card">
          <p class="meta">Peak AQI</p>
          <h3 id="peak24Value">--</h3>
        </article>
        <article class="card stat-card">
          <p class="meta">Next peak window</p>
          <h3 id="peakWindowValue">--</h3>
        </article>
        <article class="card stat-card">
          <p class="meta">Trend</p>
          <h3 id="trendValue">--</h3>
        </article>
      </section>

      <section class="chart-grid">
        <article class="card chart-card">
          <div class="card-header">
            <h3>72-hour forecast</h3>
          </div>
          <canvas id="forecastChart"></canvas>
        </article>

        <article class="card chart-card">
          <div class="card-header">
            <h3>Key pollutant snapshot</h3>
          </div>
          <canvas id="pollutantChart"></canvas>
        </article>
      </section>

      <section class="bottom-grid">
        <article class="card info-panel">
          <div class="card-header">
            <h3>Health advisory</h3>
          </div>
          <h4 id="adviceHeading">--</h4>
          <ul id="adviceList" class="bullet-list"></ul>
        </article>

        <article class="card info-panel">
          <div class="card-header">
            <h3>Action guidance</h3>
          </div>
          <ul id="recommendationList" class="bullet-list"></ul>
        </article>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
